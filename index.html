<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #fed6e3 0%, #a8c1ef 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Card Container */
        .card {
            background: rgba(255, 255, 255, 0.85);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            text-align: center;
            max-width: 450px;
            width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.5);
            z-index: 10;
            animation: fadeInCard 1s ease-out;
        }

        /* Birthday Icon / Emoji */
        .icon {
            font-size: 3.5rem;
            margin-bottom: 15px;
            animation: bounce 2s infinite ease-in-out;
        }

        /* Typography */
        h1 {
            color: #ff4a7d;
            font-size: 2.5rem;
            margin-bottom: 15px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.05);
        }

        p {
            color: #555;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        /* Interactive Button */
        .btn {
            display: inline-block;
            background: linear-gradient(45deg, #ff4a7d, #ff769f);
            color: white;
            padding: 12px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(255, 74, 125, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            border: none;
            font-size: 1.1rem;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(255, 74, 125, 0.5);
        }

        .btn:active {
            transform: translateY(-1px);
        }

        /* CSS Floating Balloons Background */
        .balloon-container {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .balloon {
            position: absolute;
            bottom: -150px;
            width: 60px;
            height: 75px;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            animation: floatUp 8s infinite linear;
            opacity: 0.7;
        }

        /* Balloon Strings */
        .balloon::after {
            content: "";
            position: absolute;
            bottom: -12px;
            left: 28px;
            width: 2px;
            height: 12px;
            background-color: #999;
        }

        /* Variation in Balloon placements and speeds */
        .balloon:nth-child(1) { left: 10%; background-color: #ff6f91; animation-duration: 7s; }
        .balloon:nth-child(2) { left: 25%; background-color: #ffc75f; animation-duration: 9s; animation-delay: 2s; }
        .balloon:nth-child(3) { left: 45%; background-color: #845ef7; animation-duration: 6s; animation-delay: 1s; }
        .balloon:nth-child(4) { left: 70%; background-color: #4ffbdf; animation-duration: 10s; animation-delay: 3s; }
        .balloon:nth-child(5) { left: 85%; background-color: #ff9671; animation-duration: 8s; animation-delay: 0.5s; }

        /* Keyframe Animations */
        @keyframes fadeInCard {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.7;
            }
            90% {
                opacity: 0.7;
            }
            100% {
                transform: translateY(-110vh) rotate(10deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Background Animated Balloons -->
    <div class="balloon-container">
        <div class="balloon"></div>
        <div class="balloon"></div>
        <div class="balloon"></div>
        <div class="balloon"></div>
        <div class="balloon"></div>
    </div>

    <!-- Main Greeting Card -->
    <div class="card">
        <div class="icon">🎂</div>
        <h1>Happy Birthday!</h1>
        <p>Wishing you a wonderful day filled with love, laughter, and all your favorite things. May this upcoming year bring you endless joy and success!</p>
        
        <!-- Action Button -->
        <button class="btn" id="celebrateBtn" onclick="togglePlayback()">Celebrate!</button>
    </div>

    <!-- Direct High-Quality Audio Link for Kabisado -->
    <audio id="birthdaySong" src="IV OF SPADES - Kabisado.mp3" preload="auto"></audio>

    <script>
        var song = document.getElementById("birthdaySong");
        var isPlaying = false;

        function togglePlayback() {
            var btn = document.getElementById("celebrateBtn");

            if (!isPlaying) {
                // Play audio element natively 
                song.play().then(function() {
                    btn.innerText = "Pause Music";
                    btn.style.background = "linear-gradient(45deg, #70a1ff, #1e90ff)";
                    btn.style.boxShadow = "0 4px 15px rgba(30, 144, 255, 0.3)";
                    isPlaying = true;
                }).catch(function(error) {
                    console.log("Playback failed to initialize:", error);
                });
            } else {
                song.pause();
                btn.innerText = "Celebrate!";
                btn.style.background = "linear-gradient(45deg, #ff4a7d, #ff769f)";
                btn.style.boxShadow = "0 4px 15px rgba(255, 74, 125, 0.3)";
                isPlaying = false;
            }
        }
    </script>

</body>
</html>
