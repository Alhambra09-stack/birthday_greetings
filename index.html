<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #fed6e3 0%, #a8c1ef 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Main Card */
        .card {
            background: rgba(255, 255, 255, 0.85);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            text-align: center;
            max-width: 450px;
            width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.5);
            z-index: 10;
            animation: fadeInCard 1s ease-out;
        }

        .icon {
            font-size: 3.5rem;
            margin-bottom: 15px;
            animation: bounce 2s infinite ease-in-out;
        }

        h1 {
            color: #ff4a7d;
            font-size: 2.5rem;
            margin-bottom: 15px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.05);
        }

        p {
            color: #555;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        /* Celebrate Button */
        .btn {
            display: inline-block;
            background: linear-gradient(45deg, #ff4a7d, #ff769f);
            color: white;
            padding: 12px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(255, 74, 125, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            border: none;
            font-size: 1.1rem;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(255, 74, 125, 0.5);
        }

        .btn:active {
            transform: translateY(-1px);
        }

        /* Balloons */
        .balloon-container {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .balloon {
            position: absolute;
            bottom: -150px;
            width: 60px;
            height: 75px;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            animation: floatUp 8s infinite linear;
            opacity: 0.7;
        }

        .balloon::after {
            content: "";
            position: absolute;
            bottom: -12px;
            left: 28px;
            width: 2px;
            height: 12px;
            background-color: #999;
        }

        .balloon:nth-child(1) {
            left: 10%;
            background-color: #ff6f91;
            animation-duration: 7s;
        }

        .balloon:nth-child(2) {
            left: 25%;
            background-color: #ffc75f;
            animation-duration: 9s;
            animation-delay: 2s;
        }

        .balloon:nth-child(3) {
            left: 45%;
            background-color: #845ef7;
            animation-duration: 6s;
            animation-delay: 1s;
        }

        .balloon:nth-child(4) {
            left: 70%;
            background-color: #4ffbdf;
            animation-duration: 10s;
            animation-delay: 3s;
        }

        .balloon:nth-child(5) {
            left: 85%;
            background-color: #ff9671;
            animation-duration: 8s;
            animation-delay: 0.5s;
        }

        /* Video Popup */
        .video-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 100;
        }

        .video-overlay.show {
            display: flex;
        }

        .video-container {
            position: relative;
            width: 100%;
            max-width: 900px;
            animation: videoPop 0.4s ease-out;
        }

        .birthday-video {
            display: block;
            width: 100%;
            max-height: 80vh;
            border-radius: 15px;
            background: #000;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        /* Close Button */
        .close-video {
            position: absolute;
            top: -15px;
            right: -15px;
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;
            background: #ff4a7d;
            color: white;
            font-size: 24px;
            cursor: pointer;
            z-index: 2;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .close-video:hover {
            background: #ff285f;
            transform: scale(1.08);
        }

        /* Animations */
        @keyframes fadeInCard {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 0.7;
            }

            90% {
                opacity: 0.7;
            }

            100% {
                transform: translateY(-110vh) rotate(10deg);
                opacity: 0;
            }
        }

        @keyframes videoPop {
            from {
                opacity: 0;
                transform: scale(0.85);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Mobile */
        @media (max-width: 600px) {
            .card {
                padding: 30px 20px;
            }

            h1 {
                font-size: 2rem;
            }

            p {
                font-size: 1rem;
            }

            .video-container {
                width: 95%;
            }

            .close-video {
                top: -10px;
                right: -10px;
            }
        }
    </style>
</head>

<body>

    <!-- Animated Balloons -->
    <div class="balloon-container">
        <div class="balloon"></div>
        <div class="balloon"></div>
        <div class="balloon"></div>
        <div class="balloon"></div>
        <div class="balloon"></div>
    </div>

    <!-- Birthday Card -->
    <div class="card">
        <div class="icon">🎂</div>

        <h1>Happy Birthday!</h1>

        <p>
            Wishing you a wonderful day filled with love, laughter,
            and all your favorite things. May this upcoming year
            bring you endless joy and success!
        </p>

        <button class="btn" id="celebrateBtn" onclick="playBirthdayVideo()">
            Celebrate! 🎉
        </button>
    </div>


    <!-- ============================= -->
    <!-- BIRTHDAY VIDEO / MP4 SECTION -->
    <!-- ============================= -->

    <div class="video-overlay" id="videoOverlay">

        <div class="video-container">

            <!-- Close Button -->
            <button class="close-video" onclick="closeBirthdayVideo()">
                ×
            </button>

            <!--
                PALITAN ANG FILE NAME SA MP4 MO.

                Halimbawa:
                birthday.mp4

                Ilagay ang MP4 sa parehong folder
                ng HTML file.
            -->
            <video
                id="birthdayVideo"
                class="birthday-video"
                controls
                playsinline
                preload="metadata">

                <source src="birthday.mp4" type="video/mp4">

                Your browser does not support HTML5 video.
            </video>

        </div>
    </div>


    <script>

        const videoOverlay = document.getElementById("videoOverlay");
        const birthdayVideo = document.getElementById("birthdayVideo");
        const celebrateBtn = document.getElementById("celebrateBtn");


        // ==========================
        // PLAY VIDEO
        // ==========================

        function playBirthdayVideo() {

            // Show video popup
            videoOverlay.classList.add("show");

            // Play the MP4
            birthdayVideo.currentTime = 0;

            birthdayVideo.play()
                .then(function () {

                    celebrateBtn.innerText = "Playing 🎬";

                })
                .catch(function (error) {

                    console.log("Video playback failed:", error);

                });
        }


        // ==========================
        // CLOSE VIDEO
        // ==========================

        function closeBirthdayVideo() {

            birthdayVideo.pause();

            birthdayVideo.currentTime = 0;

            videoOverlay.classList.remove("show");

            celebrateBtn.innerText = "Celebrate! 🎉";
        }


        // ==========================
        // CLOSE WHEN CLICKING
        // OUTSIDE THE VIDEO
        // ==========================

        videoOverlay.addEventListener("click", function(event) {

            if (event.target === videoOverlay) {
                closeBirthdayVideo();
            }

        });


        // ==========================
        // ESC KEY TO CLOSE
        // ==========================

        document.addEventListener("keydown", function(event) {

            if (event.key === "Escape") {
                closeBirthdayVideo();
            }

        });


        // ==========================
        // WHEN VIDEO ENDS
        // ==========================

        birthdayVideo.addEventListener("ended", function() {

            celebrateBtn.innerText = "Celebrate Again! 🎉";

        });

    </script>

</body>
</html>
